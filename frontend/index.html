<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Openzess</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.write('<div style="color:red;font-size:18px;z-index:99999;position:fixed;top:0;left:0;background:white;padding:20px;width:100vw;height:100vh;overflow:auto;"><b>FATAL ERROR:</b> ' + msg + '<br><br><pre>' + (error && error.stack) + '</pre></div>');
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
