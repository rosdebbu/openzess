[pytest]
testpaths = backend/tests
# OneDrive-synced folders (e.g. Documents\GitHub\...) lock files while pytest
# writes its cache, causing "OSError: [Errno 9] Bad file descriptor" crashes
# at session finish. Disable the cache provider for stable runs on synced
# folders (CI and normal filesystems are unaffected).
addopts = -p no:cacheprovider
filterwarnings =
    ignore:'audioop' is deprecated:DeprecationWarning
