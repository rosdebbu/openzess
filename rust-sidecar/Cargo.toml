[package]
name = "openzess-sidecar"
version = "0.1.0"
edition = "2021"
description = "Openzess hybrid-acceleration sidecar: stateless CPU-bound helpers (image encoding, aggregation) exposed over localhost HTTP."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
